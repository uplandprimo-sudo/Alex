<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>Alex — Serenity Hills</title>

<!-- ==================================================================
     EDIT THESE TWO LINES, THEN SAVE.
     ALEX_ENDPOINT   = your Apps Script /exec URL (deployment set to "Anyone")
     ALEX_CLIENT_ID  = the OAuth client ID from Google Cloud
     ================================================================== -->
<script>
  var ALEX_ENDPOINT  = 'https://script.google.com/macros/s/AKfycbwweJb5-GpZ1g1xEYGv4yuNogf_ivJjoE103dk2L9nLBK05gwXQch2l6eDtOMe9YfI/exec';
  var ALEX_CLIENT_ID = '86565867819-5cjdrtjllj44huh6d300nm071spfjgr5.apps.googleusercontent.com';
</script>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  :root{ --ink:#0d1117; --paper:#f5f6f8; --card:#fff; --line:#e2e6ec;
         --muted:#6b7480; --gold:#b8752b; --live:#c0392b; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{background:var(--paper);color:var(--ink);display:flex;flex-direction:column;
       font:16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}

  header{padding:13px 16px;background:var(--card);border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:11px;flex-shrink:0}
  .mark{width:36px;height:36px;border-radius:10px;background:var(--ink);color:#fff;
        display:grid;place-items:center;font-weight:600}
  h1{font-size:16px;margin:0;font-weight:600}
  .sub{font-size:11.5px;color:var(--muted)}
  .langs{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .langs button{border:0;background:transparent;padding:7px 13px;font-size:13px;
                font-weight:600;color:var(--muted);cursor:pointer}
  .langs button.on{background:var(--ink);color:#fff}

  #feed{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;
        -webkit-overflow-scrolling:touch}
  .msg{max-width:84%;padding:11px 15px;border-radius:16px;white-space:pre-wrap;
       animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px}
  .al{align-self:flex-start;background:var(--card);border:1px solid var(--line);
      border-bottom-left-radius:5px}
  .sys{align-self:center;font-size:12.5px;color:var(--muted);text-align:center;max-width:92%}
  .rtl{direction:rtl;text-align:right}

  .confirm{align-self:flex-start;display:flex;gap:9px}
  .confirm button{border:0;border-radius:10px;padding:11px 21px;font-size:14px;
                  font-weight:600;cursor:pointer}
  .yes{background:var(--gold);color:#fff}
  .no{background:var(--card);color:var(--muted);border:1px solid var(--line)}

  footer{padding:11px 14px calc(13px + env(safe-area-inset-bottom));background:var(--card);
         border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
  #clip{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;
        color:#5a6472;font-size:18px;cursor:pointer;flex-shrink:0}
  #talk{width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);color:#fff;
        font-size:23px;cursor:pointer;flex-shrink:0;touch-action:none;user-select:none;
        transition:transform .12s,background .2s}
  #talk:active,#clip:active{transform:scale(.93)}
  #talk.live{background:var(--live);animation:pulse 1.25s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.45)}
                   70%{box-shadow:0 0 0 16px rgba(192,57,43,0)}}
  #typed{flex:1;border:1px solid var(--line);border-radius:11px;padding:13px 14px;
         font-size:16px;font-family:inherit;background:var(--paper);outline:none;min-width:0}
  .hint{font-size:11.5px;color:var(--muted);text-align:center;padding:0 18px 7px;background:var(--card)}

  .dots span{display:inline-block;width:5px;height:5px;border-radius:50%;
             background:var(--muted);margin-right:3px;animation:b 1.1s infinite}
  .dots span:nth-child(2){animation-delay:.16s}
  .dots span:nth-child(3){animation-delay:.32s}
  @keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}

  #gate{position:fixed;inset:0;background:var(--paper);z-index:60;display:flex;
        flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px}
  #gate h2{margin:0;font-size:20px}
  #gate p{margin:0;font-size:13.5px;color:var(--muted);text-align:center;max-width:290px}
  #gateMsg{font-size:13px;color:var(--live);min-height:18px;text-align:center;max-width:300px}
</style>
</head>
<body>

<div id="gate">
  <div class="mark" style="width:56px;height:56px;border-radius:15px;font-size:23px">A</div>
  <h2>Alex</h2>
  <p>Serenity Hills project assistant.<br>Sign in with your Google account to continue.</p>
  <div id="gbtn"></div>
  <div id="gateMsg"></div>
</div>

<header>
  <div class="mark">A</div>
  <div>
    <h1>Alex</h1>
    <div class="sub" id="who">Serenity Hills</div>
  </div>
  <div class="langs">
    <button id="bEn" class="on" onclick="setLang('en')">EN</button>
    <button id="bAr" onclick="setLang('ar')">ع</button>
  </div>
</header>

<div id="feed"></div>
<div class="hint" id="hint">Hold the button and speak</div>

<footer>
  <button id="clip" title="Attach an invoice">&#128206;</button>
  <input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" style="display:none">
  <button id="talk">&#127908;</button>
  <input id="typed" placeholder="Or type here…"
         onkeydown="if(event.key==='Enter')sendTyped()">
</footer>

<script>
var lang='en', history=[], pending=null, draft=null;
var recog=null, listening=false, TOKEN='', greeted=false;

/* ================= Google Sign-In ================= */
window.onGoogleCredential = function (resp) {
  TOKEN = resp.credential;
  document.getElementById('gateMsg').textContent = 'Checking…';
  call({action:'ping'}).then(function (res) {
    if (res.error) {
      document.getElementById('gateMsg').textContent = friendlyAuthError(res.error);
      TOKEN = '';
      return;
    }
    document.getElementById('who').textContent = res.email || 'Serenity Hills';
    document.getElementById('gate').style.display = 'none';
    if (!greeted) { greeted = true; greet(); }
  }).catch(function () {
    document.getElementById('gateMsg').textContent =
      'Cannot reach Alex. Check the endpoint URL in this file.';
  });
};

function friendlyAuthError(code){
  if (code === 'AUTH_REQUIRED' || code === 'AUTH_EXPIRED') return 'Sign-in failed. Try again.';
  return code;
}

function initSignIn(){
  if (!window.google || !google.accounts || !google.accounts.id) {
    return setTimeout(initSignIn, 300);
  }
  if (ALEX_CLIENT_ID.indexOf('PASTE_') === 0 || ALEX_ENDPOINT.indexOf('PASTE_') === 0) {
    document.getElementById('gateMsg').textContent =
      'Set ALEX_ENDPOINT and ALEX_CLIENT_ID at the top of this file first.';
    return;
  }
  google.accounts.id.initialize({
    client_id: ALEX_CLIENT_ID,
    callback: window.onGoogleCredential,
    auto_select: true
  });
  google.accounts.id.renderButton(document.getElementById('gbtn'),
    { theme:'filled_black', size:'large', shape:'pill', text:'signin_with' });
  google.accounts.id.prompt();
}
window.addEventListener('load', initSignIn);

function requireSignIn(){
  TOKEN = '';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('gateMsg').textContent = 'Your session expired. Sign in again.';
  if (window.google && google.accounts) google.accounts.id.prompt();
}

/* ================= transport ================= */
// text/plain avoids a CORS preflight, which Apps Script cannot answer.
function call(payload){
  payload.token = TOKEN;
  return fetch(ALEX_ENDPOINT, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json(); });
}

function handled(res){
  if (res && (res.error === 'AUTH_EXPIRED' || res.error === 'AUTH_REQUIRED')) {
    requireSignIn();
    return true;
  }
  return false;
}

/* ================= ui ================= */
function greet(){
  var h=new Date().getHours();
  var g=h<12?'Good morning':(h<18?'Good afternoon':'Good evening');
  add('al', g+', Mustapha. Ask me about targets, costs, invoices or cash — '+
            'attach an invoice, or tell me what to record.');
}

function setLang(l){
  lang=l;
  document.getElementById('bEn').className=(l==='en')?'on':'';
  document.getElementById('bAr').className=(l==='ar')?'on':'';
  document.getElementById('typed').placeholder=(l==='ar')?'أو اكتب هنا…':'Or type here…';
  document.getElementById('hint').textContent=
    (l==='ar')?'اضغط الزر واحكي بالعربي':'Hold the button and speak';
  if(recog) recog.lang = (l==='ar') ? 'ar-LB' : 'en-US';
}

function add(cls,text){
  var f=document.getElementById('feed');
  var d=document.createElement('div');
  d.className='msg '+cls+((lang==='ar'&&cls!=='me')?' rtl':'');
  d.textContent=text; f.appendChild(d); f.scrollTop=f.scrollHeight; return d;
}
function dots(){
  var f=document.getElementById('feed');
  var d=document.createElement('div');
  d.className='msg al dots';
  d.innerHTML='<span></span><span></span><span></span>';
  f.appendChild(d); f.scrollTop=f.scrollHeight; return d;
}
function speak(t){
  if(!window.speechSynthesis||!t) return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t);
  u.lang=(lang==='ar')?'ar-SA':'en-US';
  speechSynthesis.speak(u);
}

/* ================= microphone ================= */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  recog=new SR();
  recog.continuous=false; recog.interimResults=false; recog.lang='en-US';
  recog.onresult=function(e){ send(e.results[0][0].transcript); };
  recog.onerror=function(e){
    stopMic();
    if(e.error==='not-allowed'){
      add('sys','Microphone blocked. Allow it for this site, then reload.');
    }else if(e.error!=='aborted' && e.error!=='no-speech'){
      add('sys','Microphone: '+e.error);
    }
  };
  recog.onend=function(){ stopMic(); };
}else{
  add('sys','Voice needs Chrome, Edge or Safari. Typing works everywhere.');
}

var talk=document.getElementById('talk');
function startMic(){
  if(!recog||listening) return;
  if(window.speechSynthesis) speechSynthesis.cancel();
  recog.lang=(lang==='ar')?'ar-LB':'en-US';
  listening=true; talk.className='live';
  try{ recog.start(); }catch(e){ listening=false; talk.className=''; }
}
function stopMic(){
  listening=false; talk.className='';
  if(recog){ try{ recog.stop(); }catch(e){} }
}
talk.addEventListener('mousedown',startMic);
talk.addEventListener('mouseup',stopMic);
talk.addEventListener('mouseleave',stopMic);
talk.addEventListener('touchstart',function(e){e.preventDefault();startMic();},{passive:false});
talk.addEventListener('touchend',function(e){e.preventDefault();stopMic();},{passive:false});

/* ================= conversation ================= */
function sendTyped(){
  var el=document.getElementById('typed');
  if(el.value.trim()){ send(el.value.trim()); el.value=''; }
}

var YES=['yes','yeah','yep','ok','okay','confirm','go ahead','do it','record it','save it',
         'نعم','ايه','اي','تمام','اوك','سجل','سجلها','اوكي','ماشي'];
var NO =['no','cancel','stop','forget it','لا','الغي','بطل'];

function send(text){
  if(!TOKEN){ requireSignIn(); return; }
  add('me',text);

  if(pending){
    var t=text.toLowerCase().trim();
    if(YES.some(function(w){return t.indexOf(w)===0||t===w;})){ commit(); return; }
    if(NO.some(function(w){return t.indexOf(w)===0||t===w;})){
      pending=null; clearBtns();
      var m=(lang==='ar')?'تمام، ما سجّلت شي.':'Fine, nothing recorded.';
      add('al',m); speak(m); return;
    }
    pending=null; clearBtns();
  }

  // A scanned invoice waiting only for a villa
  if(draft){
    var mm=text.match(/\bv\s*([123])\b/i)||text.match(/villa\s*([123])/i)||text.match(/فيلا\s*([123])/);
    if(mm){
      draft.villa='V'+mm[1];
      pending={name:'add_invoice',args:draft}; draft=null;
      var q=(lang==='ar')?'تمام، لـ '+pending.args.villa+'. بدك سجلها؟'
                         :'Got it, '+pending.args.villa+'. Shall I record it?';
      add('al',q); speak(q); showBtns();
      return;
    }
  }

  var d=dots();
  call({action:'ask', text:text, lang:lang, history:history})
    .then(function(res){
      d.remove();
      if(handled(res)) return;
      add('al',res.reply||res.error||'...');
      speak(res.reply);
      history.push({role:'user',text:text});
      history.push({role:'alex',text:res.reply||''});
      if(history.length>12) history=history.slice(-12);
      if(res.pending){ pending=res.pending; showBtns(); }
    })
    .catch(function(err){ d.remove(); add('sys','Connection problem: '+err.message); });
}

function showBtns(){
  clearBtns();
  var f=document.getElementById('feed');
  var w=document.createElement('div'); w.className='confirm'; w.id='confirmRow';
  var y=document.createElement('button'); y.className='yes';
  y.textContent=(lang==='ar')?'سجّل':'Record it'; y.onclick=commit;
  var n=document.createElement('button'); n.className='no';
  n.textContent=(lang==='ar')?'إلغاء':'Cancel';
  n.onclick=function(){
    pending=null; clearBtns();
    var m=(lang==='ar')?'تمام، ما سجّلت شي.':'Fine, nothing recorded.';
    add('al',m); speak(m);
  };
  w.appendChild(y); w.appendChild(n);
  f.appendChild(w); f.scrollTop=f.scrollHeight;
}
function clearBtns(){
  var r=document.getElementById('confirmRow'); if(r) r.remove();
}

function commit(){
  var p=pending; pending=null; clearBtns();
  var d=dots();
  call({action:'commit', pending:p})
    .then(function(res){
      d.remove();
      if(handled(res)) return;
      add('al',res.reply||res.error||'Done.');
      speak(res.reply);
      history.push({role:'alex',text:res.reply||''});
    })
    .catch(function(err){ d.remove(); add('sys','Not saved: '+err.message); });
}

/* ================= attachments ================= */
var clip=document.getElementById('clip'), fileIn=document.getElementById('file');
clip.onclick=function(){ if(!TOKEN){requireSignIn();return;} fileIn.value=''; fileIn.click(); };

fileIn.onchange=function(){
  var f=fileIn.files&&fileIn.files[0];
  if(!f) return;
  add('me','\uD83D\uDCCE '+f.name);
  var d=dots();

  prepareFile(f).then(function(out){
    return call({action:'attach', payload:{
      base64:out.base64, mimeType:out.mimeType, fileName:out.fileName, lang:lang, note:''
    }});
  }).then(function(res){
    d.remove();
    if(handled(res)) return;
    add('al',res.reply||res.error||'...');
    speak(res.reply);
    history.push({role:'alex',text:res.reply||''});
    if(res.pending){ pending=res.pending; showBtns(); }
    if(res.draft){ draft=res.draft; }
  }).catch(function(e){
    d.remove(); add('sys','Attachment failed: '+e.message);
  });
};

// Shrink photos before upload; send PDFs untouched.
function prepareFile(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onerror=function(){ reject(new Error('could not read the file')); };

    if(file.type==='application/pdf'){
      reader.onload=function(){
        resolve({ base64:reader.result.split(',')[1],
                  mimeType:'application/pdf', fileName:file.name });
      };
      reader.readAsDataURL(file);
      return;
    }

    reader.onload=function(){
      var img=new Image();
      img.onerror=function(){ reject(new Error('could not open the image')); };
      img.onload=function(){
        var scale=Math.min(1,1600/img.width);
        var c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*scale));
        c.height=Math.max(1,Math.round(img.height*scale));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve({
          base64:c.toDataURL('image/jpeg',0.85).split(',')[1],
          mimeType:'image/jpeg',
          fileName:(file.name||'invoice').replace(/\.[^.]+$/,'')+'.jpg'
        });
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
</script>
</body>
</html>
